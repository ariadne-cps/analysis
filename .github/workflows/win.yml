name: Windows

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Windows 2025 x86 MSVC", os: windows-2025, arch: x64 }
          - { name: "Windows 11 arm MSVC", os: windows-11-arm, arch: arm64 }

    steps:
      - name: Enable long paths in Git
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.config.arch }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure CMake
        run: |
          # /Z7 avoids concurrent compiler PDB writes in Debug.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_FLAGS_DEBUG="/Z7 /Ob0 /Od /RTC1" `
            -DBUILD_PYTHON_BINDINGS=ON -DPYTHON_ENFORCE_TESTS=ON `
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Reasoning
        run: cmake --build build --parallel --target ariadne-reasoning pyariadne

      - name: Build C++ tests (Debug only)
        if: matrix.build_type == 'Debug'
        run: cmake --build build --parallel --target tests

      - name: Test reasoning and Python
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build -j $env:NUMBER_OF_PROCESSORS --output-on-failure --timeout 240

      - name: Install Reasoning
        if: matrix.build_type == 'Release'
        run: cmake --install build --prefix "${{ runner.workspace }}/install"

      - name: Run installed Python Reasoning tutorial
        if: matrix.build_type == 'Release'
        shell: pwsh
        working-directory: ${{ github.workspace }}/tutorial
        run: |
          $env:PYTHONPATH = "${{ runner.workspace }}\install\Lib\site-packages"
          $env:PATH = "${{ runner.workspace }}\install\bin;$env:PATH"
          python -c "import pyariadne; print(pyariadne.__file__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tutorial_reasoning.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare C++ Reasoning tutorial
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorial" "${{ runner.workspace }}/tutorial_reasoning"

      - name: Run installed C++ Reasoning tutorial
        if: matrix.build_type == 'Release'
        shell: pwsh
        working-directory: ${{ runner.workspace }}/tutorial_reasoning
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "${{ runner.workspace }}\install\bin;$env:PATH"
          & ".\build\tutorial_reasoning.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
