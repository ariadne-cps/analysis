name: Ubuntu
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler: [clang++-16, g++-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-16 g++-13 pkg-config
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DBUILD_PYTHON_BINDINGS=ON -DPYTHON_ENFORCE_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 4 --target everything
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4
